# One refresh = every scraper once, saving into Supabase.
# Started by the website's Refresh button (workflow_dispatch) and twice a week automatically
# (keeps the free Supabase project from pausing). Secret needed: DATABASE_URL.
name: Refresh tenders

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1,4"        # Monday and Thursday 06:30 India time

concurrency:
  group: refresh                 # never two rounds at once
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # GitHub's limit is 6 hours
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "2"
      LOG_TO_STDOUT: "1"
      REFRESH_STALE_HOURS: "7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps --only-shell chromium
      - run: python -m app.schedule --once
