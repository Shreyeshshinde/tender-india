services:
  db:
    # Postgres 16 with the pgvector extension (needed later for AI search, Phase 3)
    image: pgvector/pgvector:pg16
    container_name: tender-db
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender
      POSTGRES_DB: tenders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tenders"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: tender-india-backend:latest
    container_name: tender-backend
    environment:
      DATABASE_URL: postgresql+psycopg://tender:tender@db:5432/tenders
      CORS_ORIGINS: http://localhost:3000
      DOCUMENTS_DIR: /app/documents
    volumes:
      - ./backend/documents:/app/documents
      - ./backend/logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: tender-india-frontend:latest
    container_name: tender-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
